<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project 3</title>
    <link rel="stylesheet" href="styles.css" />
    <title>Climate Precipitation Scenarios</title>
    <link rel="stylesheet" href="precipitation.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  </head>
  <body>
    <main>
      <section id="home" class="hero">
        <div class="container">
          <h1>Project3</h1>
          <p class="hero-subtitle">
            Claudine Handali, Sharon Tey, Charles Zhang, and Jeremy Cheng
          </p>
        </div>
      </section>
    </main>

    <div class="container">
      <h2 class="title">
        How climate choices reshape their rainfall (precipitation level)?
      </h2>

      <!-- year window controls -->
      <div class="year-window-controls">
        <span class="year-window-label">Year Range:</span>
        <div class="year-input-group">
          <label class="year-label">
            <span class="year-label-text">From</span>
            <input type="number" id="yearStartInput" class="year-input" />
          </label>
          <label class="year-label">
            <span class="year-label-text">To</span>
            <input type="number" id="yearEndInput" class="year-input" />
          </label>
        </div>
        <div class="year-button-group">
          <button id="applyYearBtn" class="year-button apply-button">
            Apply
          </button>
          <button id="resetYearBtn" class="year-button reset-button">
            Reset
          </button>
        </div>
      </div>

      <div class="region-selector">
        <span class="region-name" id="regionName">Northeast</span>
        <div class="region-navigation">
          <button class="nav-button" id="prevBtn">&lt; Back</button>
          <div class="dots-container" id="dotsContainer"></div>
          <button class="nav-button" id="nextBtn">Next &gt;</button>
        </div>
      </div>

      <div class="chart-container">
        <svg id="chartSvg"></svg>
        <div id="tooltip" class="tooltip"></div>
      </div>

      <!-- legend -->
      <div class="legend-container">
        <div class="legend-item" data-scenario="historical">
          <div class="legend-box legend-historical"></div>
          <span>historical</span>
        </div>
        <div class="legend-item" data-scenario="low">
          <div class="legend-box legend-low"></div>
          <span>low emission (SSP 126)</span>
        </div>
        <div class="legend-item" data-scenario="high">
          <div class="legend-box legend-high"></div>
          <span>high emission (SSP 585)</span>
        </div>
        <div class="legend-item" id="regressionToggle">
          <div class="legend-box legend-reg"></div>
          <span>regression lines</span>
        </div>
      </div>
    </div>

    <script type="module" src="precipitation.js"></script>
  </body>
</html>
