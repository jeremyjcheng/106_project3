<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>US Precipitation — Stacked Overview</title>
  <link rel="stylesheet" href="precip.css"/>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
</head>
<body>
  <header class="bar">
    <h1>US Precipitation — Overview</h1>
    <p class="hint">Hover to identify a city (white outline); click to open that city’s precipitation detail chart.</p>
  </header>

  <main class="wrap">
    <div id="overview" class="overview" aria-label="Stacked precipitation overview"></div>
  </main>

  <div id="modal" class="modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="panel">
      <button id="close" class="close" aria-label="Close">×</button>
      <h2 id="mtitle"></h2>
      <div id="detail" class="detail"></div>
    </div>
  </div>

  <script src="precip.js"></script>
</body>
</html>
